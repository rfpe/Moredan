<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="12" fill="#1e293b"/>

  <!-- 12 month rows, each a short horizontal bar with a colored event segment -->
  <!-- Row height: 4px, gap: 1px, starting at y=4, left margin=6, right margin=6 -->
  <!-- Track (full row) in dark slate, event bar in color -->

  <!-- Jan -->
  <rect x="6" y="4"  width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="4"  width="28" height="4" rx="2" fill="#3b82f6"/>

  <!-- Feb -->
  <rect x="6" y="9"  width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="9"  width="18" height="4" rx="2" fill="#f59e0b"/>

  <!-- Mar -->
  <rect x="6" y="14" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="20" y="14" width="32" height="4" rx="2" fill="#10b981"/>

  <!-- Apr -->
  <rect x="6" y="19" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="19" width="22" height="4" rx="2" fill="#8b5cf6"/>

  <!-- May -->
  <rect x="6" y="24" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="14" y="24" width="36" height="4" rx="2" fill="#3b82f6"/>

  <!-- Jun -->
  <rect x="6" y="29" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="29" width="44" height="4" rx="2" fill="#ef4444"/>

  <!-- Jul -->
  <rect x="6" y="34" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="30" y="34" width="28" height="4" rx="2" fill="#f59e0b"/>

  <!-- Aug -->
  <rect x="6" y="39" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="39" width="16" height="4" rx="2" fill="#10b981"/>

  <!-- Sep -->
  <rect x="6" y="44" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="22" y="44" width="26" height="4" rx="2" fill="#8b5cf6"/>

  <!-- Oct -->
  <rect x="6" y="49" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="49" width="38" height="4" rx="2" fill="#3b82f6"/>

  <!-- Nov -->
  <rect x="6" y="54" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="10" y="54" width="24" height="4" rx="2" fill="#ef4444"/>

  <!-- Dec -->
  <rect x="6" y="59" width="52" height="4" rx="2" fill="#334155"/>
  <rect x="6" y="59" width="30" height="4" rx="2" fill="#f59e0b"/>
</svg>
